<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Bite - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Campus Bite</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="checkout.html">Checkout</a>
        </nav>
    </header>

    <main>
        <h2>My Shopping Cart</h2>
        <ul id="cartItems"></ul>
        <h3 id="cartTotal">Total: KSh 0</h3>
        <button type="button" onclick="clearCart()">Clear Cart</button>
        <p><a href="products.html">Continue Shopping</a></p>
        <p><a href="checkout.html">Proceed to Checkout</a></p>
    </main>

    <footer>
        <p>&copy; 2026 Campus Bite</p>
    </footer>

    <script>
        function displayCart() {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            let total = 0;
            const cartItems = document.getElementById("cartItems");
            cartItems.innerHTML = "";

            cart.forEach((item, index) => {
                total += item.price;
                const listItem = document.createElement("li");
                listItem.textContent = item.name + " - KSh " + item.price + " ";

                const removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.textContent = "Remove";
                removeButton.onclick = () => removeItem(index);
                listItem.appendChild(removeButton);
                cartItems.appendChild(listItem);
            });

            document.getElementById("cartTotal").innerText = "Total: KSh " + total;
        }

        function removeItem(index) {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            displayCart();
        }

        function clearCart() {
            localStorage.removeItem("cart");
            displayCart();
        }

        displayCart();
    </script>
</body>
</html>
